name: Quality Assurance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.app.json
      - name: Build
        run: bun run build

  spell-check:
    name: Grammar & Spelling (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install && bun add -d @cspell/dict-pt-br
      - name: Run spell check
        run: bunx cspell "src/**/*.{ts,tsx}" --config cspell.json --no-progress
